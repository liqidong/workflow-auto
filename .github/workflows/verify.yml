name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: "1"
      OPENSPEC_TELEMETRY: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -e '.[dev]'

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Show OpenSpec version
        run: openspec --version

      - name: Check host workflow dependencies
        run: scripts/check-host-workflow-deps.sh

      - name: Verify workflow template
        run: scripts/verify-workflow-template.sh

      - name: Run pytest contract suite
        run: ./.venv/bin/pytest -q

      - name: Validate OpenSpec specs
        run: openspec validate --specs
